
apiVersion: apps/v1
kind: Deployment
metadata:
  name: week12selenium-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: week12selenium
  template:
    metadata:
      labels:
        app: week12selenium
    spec:
      containers:
        - name: week12selenium
          image: mersineelakantam/week12selenium:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5003
